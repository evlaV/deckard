[Unit]

# Enabling adb mode in the bootloader creates this file
ConditionPathExists=|/proc/device-tree/chosen/u-boot,adb-mode

# Enabling factory mode in the bootloader creates this file
ConditionPathExists=|/proc/device-tree/chosen/u-boot,factory-mode

# u-boot can disable us if need be (e.g. USB Serial debugging)
ConditionPathExists=!/proc/device-tree/chosen/u-boot,disable-adb

# This is a special file that `steamos-devkit-mode` creates to enable adbd/USB ncm, since we want
# this `adbd.service` to always be enabled so that the bootloader path works
ConditionPathExists=|/etc/systemd/system/adbd.service.d/steamos-devkit-enabled

[Service]
# Tell adbd to drop to steamos by default, but allow running as root
Environment=ADB_USER=steamos
Environment=ADB_ALLOW_ROOT=true

# The bootloader will create this to force us into root mode
Environment=ADB_FORCE_ROOT_PATH=/proc/device-tree/chosen/u-boot,factory-mode