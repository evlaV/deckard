# Force rtkit to have higher limits that normal, to allow SteamVR/XRService to turn on all their threads.
# We found that 50 was too low sometimes, so we bump up to 100 to have some headroom.
# We also add `--no-chroot` to allow it to write to `/sys/kernel/tracing` and `--no-polkit`
# to mitigate performance issues (since we don't use polkit anyway, and the dbus bouncing
# was cumbersome).
[Service]
ExecStart=
ExecStart=/usr/lib/rtkit-daemon \
  --threads-per-user-max=200 \
  --actions-per-burst-max=1000 \
  --max-realtime-priority=80 \
  --our-realtime-priority=81 \
  --no-chroot \
  --no-polkit